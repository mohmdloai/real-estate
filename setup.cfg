[metadata]
name = real-estate
version = 0.1.0
description = Multi-database backend for real estate applications
long_description = file: README.md
long_description_content_type = text/markdown
author = mhmdloai
maintainer = mhmdloai
license = BSD 3-Clause License
license_files = LICENSE

keywords = real-estate, database, backend, api
platforms = linux, macOs, freebsd.

