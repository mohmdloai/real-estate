[project]
name = "real-estate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgiref==3.9.1",
    "django==5.2.6",
    "djangorestframework==3.16.0",
    "djangorestframework-simplejwt==5.5.0",
    "factory-boy==3.3.3",
    "faker==37.6.0",
    "flake8>=7.3.0",
    "inflection==0.5.1",
    "iniconfig==2.1.0",
    "packaging==25.0",
    "pillow==11.3.0",
    "pluggy==1.6.0",
    "pre-commit>=4.3.0",
    "psycopg2==2.9.10",
    "psycopg[pool]>=3.2.10",
    "pygments==2.19.2",
    "pyjwt==2.9.0",
    "pytest==8.4.1",
    "pytest-django>=4.9.0",
    "pytest-factoryboy==2.8.1",
    "python-dotenv==1.1.1",
    "sqlparse==0.5.3",
    "typing-extensions==4.15.0",
    "tzdata==2025.2",
]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_django = "django"
known_first_party = ["core", "users", "listings"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
